name: Branch Pipeline

on:
  push:
    branches: [dev, uat, main]
  pull_request:
    branches: [dev, uat, main]

permissions:
  contents: read

concurrency:
  group: branch-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion-policy:
    name: Promotion policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify branch promotion order
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          case "$BASE_BRANCH" in
            dev)
              case "$HEAD_BRANCH" in
                feature/*|bugfix/*|hotfix/*) ;;
                *) echo "Pull requests into dev must come from feature/*, bugfix/*, or hotfix/*."; exit 1 ;;
              esac
              ;;
            uat)
              test "$HEAD_BRANCH" = "dev" || { echo "Only dev can be promoted to uat."; exit 1; }
              ;;
            main)
              test "$HEAD_BRANCH" = "uat" || { echo "Only uat can be promoted to main."; exit 1; }
              ;;
          esac

  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
